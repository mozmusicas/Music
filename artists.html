<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artists — CYBER MUSIC</title>
<meta name="description" content="Diretório de 30 artistas verificados: Ella Langley, Mr. Bow, Laylizzy, Sam Deep, Kabza De Small e outros.">
<link rel="canonical" href="https://musicas.github.io/artists.html">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
<style id="cyber-critical">
:root{--bg-deep:#050508;--bg-card:#0c0c12;--bg-elevated:#12121a;--border:#1e1e2a;--cyan:#00e5ff;--electric:#2979ff;--purple:#7c4dff;--text-primary:#f0f4f8;--text-secondary:#a0aec0;--text-muted:#718096;--font-display:'Orbitron',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#050508!important;color:#f0f4f8!important;font-family:Inter,system-ui,sans-serif;line-height:1.6;min-height:100vh}
a{color:#00e5ff;text-decoration:none}
a:hover{color:#fff}
.site-header{position:sticky;top:0;z-index:100;background:rgba(5,5,8,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e1e2a}
.header-inner{max-width:1120px;margin:0 auto;padding:.85rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font-family:Orbitron,system-ui,sans-serif;font-weight:700;letter-spacing:.06em;color:#00e5ff;font-size:1.05rem;display:flex;align-items:center;gap:.4rem}
.nav-main{display:flex;flex-wrap:wrap;gap:.65rem 1rem}
.nav-main a{color:#a0aec0;font-size:.85rem;font-weight:500}
.nav-main a:hover,.nav-main a.active{color:#00e5ff}
.cyber-ticker{overflow:hidden;background:#0a0a10;border-bottom:1px solid #1e1e2a;font-size:.72rem;letter-spacing:.08em;color:#00e5ff;padding:.45rem 0;white-space:nowrap}
.ticker-track{display:inline-block;animation:ticker 40s linear infinite}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.main-content,.section,.container{max-width:1120px;margin:0 auto;padding:1.25rem}
.section-title{font-family:Orbitron,system-ui,sans-serif;font-size:1.35rem;margin:1.5rem 0 1rem;color:#f0f4f8;display:flex;align-items:center;gap:.5rem}
.card,.chart-row{background:#0c0c12;border:1px solid #1e1e2a;border-radius:10px;padding:1rem;margin-bottom:.75rem}
.chart-row{display:grid;grid-template-columns:40px 1fr auto;gap:.75rem;align-items:center}
.btn-primary,.btn-outline,button{cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#00e5ff,#2979ff);color:#000;border:0;padding:.55rem 1rem;border-radius:8px;font-weight:600}
.site-footer{margin-top:3rem;border-top:1px solid #1e1e2a;padding:2rem 1.25rem;background:#08080e;color:#a0aec0;font-size:.85rem}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
img{max-width:100%;height:auto;display:block;border-radius:8px}
input,select{background:#12121a;border:1px solid #1e1e2a;color:#f0f4f8;padding:.5rem .75rem;border-radius:8px}
@media(max-width:700px){.nav-main{width:100%}.header-inner{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header class="site-header">
<div class="header-inner container">
<a href="index.html" class="logo"><span class="logo-icon">▶</span> CYBER MUSIC</a>
<nav class="nav-main" aria-label="Main">
<a href="index.html">Home</a>
<a href="charts.html">Charts</a>
<a href="news.html">News</a>
<a href="artists.html" class="active">Artists</a>
<a href="albums.html">Albums</a>
<a href="music.html">Music</a>
<a href="mozambique.html">Moçambique</a>
<a href="about.html">About</a>
</nav>
<button class="menu-toggle" aria-label="Menu">☰</button>
</div>
</header>
<div class="cyber-ticker" aria-hidden="true"><div class="ticker-track">
<span class="ticker-item"><span class="dot"></span> ARTIST DIRECTORY · 30 VERIFIED</span>
<span class="ticker-item"><span class="dot"></span> MOZAMBIQUE · USA · SOUTH AFRICA · NIGERIA</span>
</div></div>
<main class="main-content">
<section class="section container">
<h1 class="section-title">Featured Artists</h1>
<p style="color:var(--text-muted);margin-bottom:2rem;max-width:640px;">Perfis baseados em informação pública verificável. Dados carregados de <code>data/artists.json</code>.</p>
<div class="cards-grid" id="artists-grid"><p style="color:#666">Loading artists…</p></div>
</section>
</main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© 2026 Cyber Music</span><a href="index.html">Home</a></div></div></footer>
<script src="js/app.js" defer></script>
<script src="js/player.js" defer></script>
<script>
(async function(){
  try {
    const res = await fetch('data/artists.json');
    const data = await res.json();
    const grid = document.getElementById('artists-grid');
    const params = new URLSearchParams(location.search);
    const focus = params.get('artist');
    grid.innerHTML = (data.artists || []).map(a => {
      const img = a.image
        ? '<img src="'+a.image+'" alt="'+(a.imageAlt||a.name)+'" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:.75rem;border:1px solid #1e1e2a">'
        : '<div style="width:100%;aspect-ratio:1;background:#12121a;border-radius:8px;margin-bottom:.75rem;display:flex;align-items:center;justify-content:center;color:#445;font-size:.8rem">No verified image</div>';
      const genres = (a.genres||[]).join(' · ');
      const hl = focus && (a.id===focus || a.name===focus) ? 'outline:2px solid #00e5ff' : '';
      return '<article class="card" id="artist-'+a.id+'" style="'+hl+'"><div class="card-body">'+img+
        '<div class="card-category">'+(a.country||'')+' · '+genres+'</div>'+
        '<h2 class="card-title">'+a.name+'</h2>'+
        '<p style="color:var(--text-secondary);font-size:0.9rem;margin:0.6rem 0">'+(a.bio||'').slice(0,180)+(a.bio&&a.bio.length>180?'…':'')+'</p>'+
        (a.notableTracks&&a.notableTracks.length?'<p class="card-meta">Tracks: '+a.notableTracks.slice(0,3).join(', ')+'</p>':'')+
        '</div></article>';
    }).join('');
    if (focus) {
      const el = document.getElementById('artist-'+focus);
      if (el) el.scrollIntoView({behavior:'smooth',block:'center'});
    }
  } catch(e) {
    document.getElementById('artists-grid').innerHTML = '<p>Could not load artists data.</p>';
  }
})();
</script>
</body>
</html>
